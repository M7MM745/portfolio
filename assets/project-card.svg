<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Abstract dark digital business card mockup">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b0f19"/><stop offset="1" stop-color="#0f1b28"/></linearGradient>
    <linearGradient id="em" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10b981"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="cardface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".12"/><stop offset="1" stop-color="#ffffff" stop-opacity=".03"/></linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="120" cy="380" r="190" fill="#10b981" opacity=".08"/><circle cx="700" cy="70" r="210" fill="#38bdf8" opacity=".07"/>
  <!-- main card -->
  <g transform="rotate(-6 400 228)">
    <rect x="176" y="104" width="448" height="252" rx="28" fill="url(#cardface)" stroke="#ffffff" stroke-opacity=".16" stroke-width="1.5"/>
    <path d="M176 132a28 28 0 0 1 28-28h392a28 28 0 0 1 28 28v30H176Z" fill="url(#em)" fill-opacity=".14"/>
    <circle cx="222" cy="168" r="30" fill="url(#em)" fill-opacity=".7"/>
    <circle cx="222" cy="160" r="9" fill="#e8fff7" fill-opacity=".85"/><path d="M204 184c4-12 32-12 36 0Z" fill="#e8fff7" fill-opacity=".7"/>
    <rect x="266" y="154" width="132" height="12" rx="6" fill="#ffffff" fill-opacity=".34"/>
    <rect x="266" y="176" width="88" height="9" rx="4.5" fill="#10b981" fill-opacity=".7"/>
    <rect x="218" y="228" width="190" height="8" rx="4" fill="#ffffff" fill-opacity=".17"/>
    <rect x="218" y="248" width="152" height="8" rx="4" fill="#ffffff" fill-opacity=".13"/>
    <rect x="218" y="268" width="174" height="8" rx="4" fill="#ffffff" fill-opacity=".13"/>
    <!-- QR-like pattern -->
    <g transform="translate(486 220)" fill="#38bdf8" fill-opacity=".65">
      <rect width="12" height="12" rx="2"/><rect x="16" width="12" height="12" rx="2"/><rect x="32" width="12" height="12" rx="2"/>
      <rect y="16" width="12" height="12" rx="2"/><rect x="24" y="16" width="12" height="12" rx="2"/>
      <rect x="8" y="32" width="12" height="12" rx="2"/><rect x="32" y="32" width="12" height="12" rx="2"/>
      <rect x="16" y="48" width="12" height="12" rx="2"/><rect x="40" y="48" width="12" height="12" rx="2"/>
      <rect y="48" width="12" height="12" rx="2"/><rect x="40" y="16" width="12" height="12" rx="2"/>
    </g>
    <rect x="218" y="308" width="92" height="22" rx="11" fill="url(#em)" fill-opacity=".8"/>
  </g>
  <!-- floating icons -->
  <circle cx="152" cy="118" r="30" fill="#ffffff" fill-opacity=".05" stroke="#10b981" stroke-opacity=".35"/>
  <path d="M140 118h24m-12-12v24" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
  <circle cx="670" cy="342" r="30" fill="#ffffff" fill-opacity=".05" stroke="#38bdf8" stroke-opacity=".35"/>
  <path d="M658 348c12-16 24-16 28-6 3 8 10 8 14 0" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round"/>
</svg>
